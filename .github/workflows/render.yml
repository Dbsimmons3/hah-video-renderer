name: render

# Daily at 15:20 UTC: 20 minutes after the site queues the week's Freight Pulse videos (its 15:00
# UTC cron, after Tuesday's 14:30 publish) and any new monthly report. Run it by hand any time
# from the Actions tab (workflow_dispatch); an empty queue is a no-op.
on:
  schedule:
    - cron: "20 15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  # Only for the keep-alive step below.
  actions: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Render and upload
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          VIDEO_UPLOAD_TOKEN: ${{ secrets.VIDEO_UPLOAD_TOKEN }}
        run: python run.py
      # GitHub disables scheduled workflows in a public repo after 60 days without a commit. This
      # repo rarely changes, so each run re-enables its own schedule (the approach of the
      # keepalive-workflow action's API mode). Harmless when already enabled.
      - name: Keep the schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/render.yml/enable"
